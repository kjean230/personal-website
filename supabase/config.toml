# Supabase CLI project config (S2). Trimmed from `supabase init`; every
# omitted section keeps its CLI default.
#
# Read by:
#   * `supabase db push` / `supabase db reset` (migrations + seed paths)
#   * Supabase Branching, which applies supabase/migrations to each preview
#     branch, runs supabase/seed.sql on it, and applies the [auth] settings.
#
# Local development uses docker-compose.yml (Postgres only) on the same port,
# so DATABASE_URL is the same whether the CLI stack or compose is running.

project_id = "personal-website"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# New objects in `public` are NOT auto-exposed to anon/authenticated (the
# current cloud default). Every table and view carries explicit GRANTs in
# its migration; never rely on default privileges.

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Must match the hosted project (`show server_version;`) and the image tag in
# docker-compose.yml.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Fixture data only — see the header of seed.sql. Runs on `db reset` and on
# preview branches; never on production.
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Brief §7: auth is admin-only, one user. Nobody self-registers; the owner's
# user is created from the dashboard. RLS does not depend on this (admin
# writes require the `app_metadata.role = 'admin'` claim, see
# public.is_admin()), so this is a second fence, not the only one.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false
