# Dependabot version updates. Security updates are enabled in the repo
# settings (Settings → Advanced Security). PRs target main and sit behind the
# "CI green" required check plus the main ruleset's required review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor/patch bumps; majors stay individual.
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
