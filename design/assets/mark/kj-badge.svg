<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="kj-badge-title">
  <title id="kj-badge-title">KJ monogram as a tile badge</title>
  <!-- Identity C · Ink & paper. A saffron tile (radius-md) carrying the mark in
       on-primary ink. The 2 px edge is the color-outline-accent token: ink on paper, so
       the accent fill is outlined; saffron on ink, so the fill stands alone. Colours are
       var() references with the light-theme values as fallbacks, so the file renders
       the paper variant when used standalone and follows the theme when inlined. -->
  <rect x="1" y="1" width="62" height="62" rx="4" fill="var(--color-primary, #E8B11B)" stroke="var(--color-outline-accent, #17160F)" stroke-width="2"/>
  <svg x="10" y="13.5" width="44" height="37" viewBox="0 0 76 64">
    <g fill="var(--color-on-primary, #17160F)">
      <rect x="4" y="8" width="20" height="6"/>
      <rect x="8" y="8" width="12" height="48"/>
      <rect x="4" y="50" width="20" height="6"/>
      <rect x="50" y="8" width="24" height="6"/>
      <rect x="58" y="8" width="12" height="36"/>
    </g>
    <g fill="none" stroke="var(--color-on-primary, #17160F)" stroke-width="11" stroke-linecap="butt">
      <path d="M26 33L42 11"/>
      <path d="M26 31L42 57"/>
      <path d="M64 46a10 10 0 0 1-10 10h-8"/>
    </g>
  </svg>
</svg>
